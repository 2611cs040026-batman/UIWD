<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Online Student Service Request</title>
  <style>
    body { font-family: Arial, sans-serif; background: #f3f6fb; margin: 0; padding: 20px; color: #243047; }
    .box { max-width: 700px; margin: auto; background: white; padding: 24px; border-radius: 10px; }
    label { display: block; margin-top: 12px; }
    input, select, textarea, button { width: 100%; padding: 10px; margin-top: 5px; }
    button { background: #173b70; color: white; border: 0; margin-top: 18px; cursor: pointer; }
    #confirmation { background: #e7f6eb; padding: 12px; margin-top: 16px; }
  </style>
</head>
<body>
<div class="box">
  <h1>Online Student Service Request</h1>
  <label>Choose service
    <select id="service">
      <option value="leave">Leave Request</option>
      <option value="bonafide">Bonafide Certificate</option>
      <option value="course">Elective Course Registration</option>
    </select>
  </label>
  <form id="requestForm">
    <label>Student name <input id="studentName" required></label>
    <label>Roll number <input id="roll" required></label>
    <label>Email <input id="email" type="email" required></label>
    <div id="leaveFields">
      <label>Start date <input id="startDate" type="date"></label>
      <label>End date <input id="endDate" type="date"></label>
      <label>Reason <textarea id="reason" rows="3"></textarea></label>
    </div>
    <div id="bonafideFields" hidden>
      <label>Certificate purpose <input id="purpose"></label>
    </div>
    <div id="courseFields" hidden>
      <label>Select course
        <select id="course"><option value="">Choose a course</option><option>Course A</option><option>Course B</option><option>Course C</option></select>
      </label>
    </div>
    <button type="submit">Submit Request</button>
  </form>
  <div id="confirmation" role="status" hidden></div>
</div>
<script>
  const requests = [];
  const service = document.getElementById("service");
  const leaveFields = document.getElementById("leaveFields");
  const bonafideFields = document.getElementById("bonafideFields");
  const courseFields = document.getElementById("courseFields");
 
  function updateFields() {
    leaveFields.hidden = service.value !== "leave";
    bonafideFields.hidden = service.value !== "bonafide";
    courseFields.hidden = service.value !== "course";
  }
  service.addEventListener("change", updateFields);
  updateFields();
 
  document.getElementById("requestForm").addEventListener("submit", function(event) {
    event.preventDefault();
    const type = service.value;
    const request = {
      type: type,
      name: document.getElementById("studentName").value.trim(),
      roll: document.getElementById("roll").value.trim(),
      email: document.getElementById("email").value.trim()
    };
 
    if (type === "leave") {
      request.start = document.getElementById("startDate").value;
      request.end = document.getElementById("endDate").value;
      request.reason = document.getElementById("reason").value.trim();
      if (!request.start || !request.end || request.end < request.start || !request.reason) {
        alert("Enter valid leave dates and reason. End date cannot be before start date.");
        return;
      }
    } else if (type === "bonafide") {
      request.purpose = document.getElementById("purpose").value.trim();
      if (!request.purpose) { alert("Enter the certificate purpose."); return; }
    } else {
      request.course = document.getElementById("course").value;
      if (!request.course) { alert("Select an elective course."); return; }
    }
 
    requests.push(request);
    const confirmation = document.getElementById("confirmation");
    confirmation.hidden = false;
    confirmation.textContent = "Request submitted for demonstration. Request type: " +
      type + ". Student: " + request.name + ". Requests in this browser session: " + requests.length + ".";
    this.reset();
    updateFields();
  });
</script>
</body>
</html>
